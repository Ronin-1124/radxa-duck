[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radxa-duck"
version = "0.1.0"
description = "Voice, vision and application services for the Radxa Duck robot"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3",
  "sherpa-onnx==1.13.8",
  "starlette==1.10.0",
  "uvicorn==0.53.0",
  "websockets==16.0",
]

[project.scripts]
radxa-duck = "radxa_duck.server:main"
radxa-duck-vision = "radxa_duck.vision:main"

[project.optional-dependencies]
test = ["httpx==0.28.1"]
vision = ["numpy>=1.24,<2", "opencv-python-headless==4.10.0.84"]

[tool.setuptools.packages.find]
where = ["src"]
